[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "crowdsafe"
version = "0.2.0"
description = "Open-source crowd-crush prevention: capacity planning, live density monitoring, early warning and response playbooks."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "abhieq31" }]
keywords = ["crowd safety", "stampede", "crowd crush", "disaster risk reduction", "computer vision", "early warning"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = []  # the core engine is pure Python on purpose (runs anywhere)

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
vision = ["numpy>=1.24", "opencv-python-headless>=4.8"]
onnx = ["onnxruntime>=1.17"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "crowdsafe[server,vision]"]

[project.scripts]
crowdsafe = "crowdsafe.cli:main"

[project.urls]
Homepage = "https://github.com/abhieq31/crowdsafe"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crowdsafe = ["data/*.json", "data/venues/*.json", "web/*", "web/js/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic
