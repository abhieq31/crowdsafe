[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "roomtobreathe"
version = "1.1.0"
description = "Open-source crowd-crush prevention: safe capacity, the streets around the venue, live density monitoring, early warning and response playbooks."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "abhieq31" }]
keywords = ["crowd safety", "stampede", "crowd crush", "disaster risk reduction", "computer vision", "early warning"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Intended Audience :: Other Audience",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = []  # the core engine is pure Python on purpose (runs anywhere)

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
vision = ["numpy>=1.24", "opencv-python-headless>=4.8"]
onnx = ["onnxruntime>=1.17"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "roomtobreathe[server,vision]"]

[project.scripts]
roomtobreathe = "roomtobreathe.cli:main"
rtb = "roomtobreathe.cli:main"

[project.urls]
Homepage = "https://abhieq31.github.io/roomtobreathe/"
Source = "https://github.com/abhieq31/roomtobreathe"
Documentation = "https://github.com/abhieq31/roomtobreathe/blob/main/docs/DEPLOY.md"
Issues = "https://github.com/abhieq31/roomtobreathe/issues"
Changelog = "https://github.com/abhieq31/roomtobreathe/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
roomtobreathe = ["data/*.json", "data/venues/*.json", "web/*", "web/js/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"src/roomtobreathe/surroundings/report.py" = ["E501"]  # an HTML/JS page template
