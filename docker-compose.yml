# Control room on one computer:  docker compose up -d
# Put your venue file at ./data/venue.json (crowdsafe venue new). The event record goes to ./data/logs.
services:
  crowdsafe:
    image: ghcr.io/abhieq31/crowdsafe:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      # Access code for operators and camera devices. Change it before the event.
      CROWDSAFE_TOKEN: ${CROWDSAFE_TOKEN:-}
    restart: unless-stopped
