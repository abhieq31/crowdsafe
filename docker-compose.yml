# Control room on one computer:  docker compose up -d
# Put your venue file at ./data/venue.json (roomtobreathe venue new). The event record goes to ./data/logs.
services:
  roomtobreathe:
    image: ghcr.io/abhipatelz/roomtobreathe:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      # Access code for operators and camera devices. Change it before the event.
      RTB_TOKEN: ${RTB_TOKEN:-}
    restart: unless-stopped
