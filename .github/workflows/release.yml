name: Release
# Push a tag like v0.2.0 to publish:
#   - ghcr.io/abhieq31/roomtobreathe       (control-room server)  linux/amd64 + linux/arm64
#   - ghcr.io/abhieq31/roomtobreathe-edge  (camera device, model included)
#   - a GitHub release with the Python wheel, so  pip install <wheel URL>  works without git
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: roomtobreathe
            file: docker/Dockerfile
          - name: roomtobreathe-edge
            file: docker/Dockerfile.edge
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - name: Check the version matches the tag
        run: test "v$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" = "${{ github.ref_name }}"
      - run: gh release create "${{ github.ref_name }}" dist/* --title "Room to Breathe ${{ github.ref_name }}" --notes-file docs/RELEASE_NOTES.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
