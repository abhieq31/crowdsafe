name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q

  core-without-deps:
    # The core engine must run with zero third-party packages (Tier 0 devices).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . && roomtobreathe capacity --area 960 --exit 3 --exit 2.5 && roomtobreathe simulate --respond --minutes 25

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/js/*.test.mjs

  docker:
    # The images people deploy must build and start. The release workflow publishes them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build server image
        run: docker build -f docker/Dockerfile -t roomtobreathe:test .
      - name: Server starts in demo mode and answers health checks
        run: |
          docker run -d --name demo -p 8000:8000 roomtobreathe:test
          for i in $(seq 30); do curl -fs localhost:8000/api/health && break; sleep 1; done
          curl -fs localhost:8000/api/health | grep '"mode":"demo"'
          docker rm -f demo
      - name: Server runs live with a mounted venue, token and writable event record
        run: |
          mkdir -p data && cp src/roomtobreathe/data/venues/pandal.json data/venue.json
          docker run -d --name live -p 8001:8000 -v "$PWD/data:/data" -e RTB_TOKEN=t roomtobreathe:test
          for i in $(seq 30); do curl -fs localhost:8001/api/health && break; sleep 1; done
          curl -fs localhost:8001/api/health | grep '"auth_required":true'
          curl -fs -X POST localhost:8001/api/actions -H 'Authorization: Bearer t' \
            -H 'Content-Type: application/json' -d '{"action":{"type":"announce"},"by":"ci"}'
          docker logs live
          grep -h '"by": "ci"' data/logs/*.jsonl
          docker rm -f live
      - name: Build edge image (model baked in, checksum verified)
        run: |
          docker build -f docker/Dockerfile.edge -t roomtobreathe-edge:test .
          docker run --rm roomtobreathe-edge:test model list | grep -E 'dense +downloaded'
